# The robot inspector: lint and test on every pull request and after every merge to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff==0.8.0

      - name: Lint with ruff
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90 --junitxml=report.xml
