# The robot inspector: lint and test on every pull request,
# then build and ship the image after every merge to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# By default every job may only read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Use the secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRT }}
        run: |
          echo "The secret has ${#DEMO_SECRET} characters"
          echo "Trying to print it: $DEMO_SECRET"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff==0.8.0

      - name: Lint with ruff
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90 --junitxml=report.xml

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push the image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
